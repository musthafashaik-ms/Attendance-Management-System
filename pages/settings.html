<div class="top-header">
    <div>
        <h1>System Settings</h1>
        <p>Manage attendance, leave and company settings</p>
    </div>
</div>

<div class="settings-grid">

    <!-- Company Settings -->
    <div class="settings-card">

        <h2>Company Information</h2>

        <div class="form-grid">

            <input
                type="text"
                id="companyName"
                placeholder="Company Name">

            <input
                type="email"
                id="companyEmail"
                placeholder="Company Email">

            <input
                type="text"
                id="companyPhone"
                placeholder="Company Phone">

        </div>

    </div>

    <!-- Attendance Settings -->
    <div class="settings-card">

        <h2>Attendance Rules</h2>

        <div class="form-grid">

            <input
                type="number"
                step="0.25"
                id="fullDayHours"
                placeholder="Full Day Hours">

            <input
                type="number"
                step="0.25"
                id="halfDayHours"
                placeholder="Half Day Hours">

            <select id="weekOffDay">

                <option value="Sunday">
                    Sunday
                </option>

                <option value="Saturday">
                    Saturday
                </option>

                <option value="Friday">
                    Friday
                </option>

            </select>

        </div>

    </div>

    <!-- Leave Settings -->
    <div class="settings-card">

        <h2>Leave Credit Settings</h2>

        <div class="form-grid">

            <input
                type="number"
                step="0.5"
                id="monthlyCredit"
                placeholder="Monthly Leave Credit">

            <select id="allowNegative">

                <option value="true">
                    Allow Negative Credits
                </option>

                <option value="false">
                    Block Negative Credits
                </option>

            </select>

        </div>

    </div>

    <!-- Admin Settings -->
    <div class="settings-card">

        <h2>Admin Account</h2>

        <div class="form-grid">

            <input
                type="text"
                id="adminUser"
                placeholder="Admin Username">

            <input
                type="password"
                id="adminPassword"
                placeholder="Admin Password">

        </div>

    </div>

    <div class="save-container">

        <button
            id="saveSettingsBtn"
            class="primary-btn">

            Save Settings

        </button>

    </div>

</div>
