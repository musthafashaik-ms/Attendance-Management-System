<div class="top-header">
    <div>
        <h1>Attendance Management</h1>
        <p>Manage employee attendance records</p>
    </div>
</div>

<section class="form-card">
    <h2>Employee Attendance Records</h2>

    <div class="form-grid">

        <input type="date" id="attendanceDate">

        <button id="saveAttendanceBtn" class="primary-btn">
            <i class="fa-solid fa-floppy-disk"></i>
            Save Attendance
        </button>

        <button id="exportCsvBtn" class="primary-btn">
            <i class="fa-solid fa-file-csv"></i>
            Export CSV
        </button>

        <button id="exportExcelBtn" class="primary-btn">
            <i class="fa-solid fa-file-excel"></i>
            Export Excel
        </button>

    </div>
</section>

<section class="table-card">
    <div class="table-header">
        <h2>Attendance Records</h2>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Login</th>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Department</th>
                    <th>Login Time</th>
                    <th>Logout Time</th>
                    <th>Working Hrs</th>
                    <th>Status</th>
                    <th>Leave Credits</th>
                </tr>
            </thead>

            <tbody id="attendanceEmployeeTable">
                <!-- Dynamic rows -->
            </tbody>
        </table>
    </div>
</section>
