<div class="top-header">
    <div>
        <h1>Attendance Management</h1>
        <p>Manage employee attendance records</p>
    </div>
</div>

<section class="table-card">
    <div class="table-header">
        <h2>Employee Attendance Records</h2>

        <div style="display:flex; gap:10px; align-items:center;">
            <input type="date" id="attendanceDate">
            <button id="saveAttendanceBtn" class="primary-btn">
                Save Attendance
            </button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Department</th>
                    <th>Login Time</th>
                    <th>Logout Time</th>
                    <th>Working Hrs</th>
                    <th>Status</th>
                    <th>Leave Credits</th>
                </tr>
            </thead>

            <tbody id="attendanceEmployeeTable"></tbody>
        </table>
    </div>
</section>
