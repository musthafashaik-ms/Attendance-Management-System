<div class="top-header">
    <div>
        <h1>Staff Management</h1>
        <p>Add and manage employee details</p>
    </div>
</div>

<!-- Employee Form -->
<section class="form-card">
    <h2>Add Employee</h2>

    <form id="employeeForm">
        <div class="form-grid">

            <input
                type="text"
                id="empId"
                placeholder="Employee ID"
                required
            >

            <input
                type="text"
                id="empName"
                placeholder="Employee Name"
                required
            >

            <input
                type="text"
                id="empRole"
                placeholder="Role"
                required
            >

            <input
                type="text"
                id="empDepartment"
                placeholder="Department"
                required
            >

            <input
                type="number"
                id="leaveCredits"
                placeholder="Leave Credits"
                required
                step="0.1"
                min="0"
            >

            <input
                type="date"
                id="joiningDate"
                required
            >

            <input
                type="date"
                id="presentDate"
                required
            >

            <input
                type="text"
                id="experience"
                placeholder="Total Experience (e.g. 2 Years 3 Months)"
                required
            >

        </div>

        <button type="submit" class="primary-btn">
            <i class="fa-solid fa-plus"></i>
            Save Employee
        </button>
    </form>
</section>

<!-- Employee Table -->
<section class="table-card">
    <div class="table-header">
        <h2>Employee Records</h2>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Department</th>
                    <th>Leave Credits</th>
                    <th>Joining Date</th>
                    <th>Present Date</th>
                    <th>Total Experience</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="employeeTable">
                <!-- Dynamic rows -->
            </tbody>
        </table>
    </div>
</section>
