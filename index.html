<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">

    <!-- Permanent Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-users"></i>
            <span>Attendance Management</span>
        </div>

        <nav class="sidebar-menu">

            <a href="#" class="menu-item active" data-page="dashboard">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Dashboard</span>
            </a>

            <a href="#" class="menu-item" data-page="employees">
                <i class="fa-solid fa-users"></i>
                <span>Staff Management</span>
            </a>

            <a href="#" class="menu-item" data-page="attendance">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Attendance</span>
            </a>

            <a href="#" class="menu-item" data-page="leave">
                <i class="fa-solid fa-wallet"></i>
                <span>Leave Credits</span>
            </a>

            <a href="#" class="menu-item" data-page="ot">
                <i class="fa-solid fa-money-check-dollar"></i>
                <span>OT / Pay Records</span>
            </a>

            <a href="#" class="menu-item" data-page="reports">
                <i class="fa-solid fa-file-lines"></i>
                <span>Reports</span>
            </a>

            <a href="#" class="menu-item" data-page="settings">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>

            <a href="#" class="menu-item" data-page="logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>

        </nav>
    </aside>

    <!-- Dynamic Content Area -->
    <main class="main-content">
        <div id="pageContent">
            <!-- Pages load here -->
        </div>
    </main>

</div>

<script src="js/app.js"></script>
</body>
</html>
